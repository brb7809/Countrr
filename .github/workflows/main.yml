import os
import pdfplumber
import pandas as pd

# 1. Definir la ruta donde están tus PDFs. 
# Reemplaza 'C:\\Ruta\\A\\Tus\\PDFs' con la ruta real de tu carpeta.
# Usamos una "r" antes de la comilla para que Windows lea la ruta correctamente.
CARPETA_PDFS = r"C:\Ruta\A\Tus\PDFs"

def procesar_archivos():
    # Creamos una lista vacía para guardar nuestros resultados finales
    resultados = []

    # 2. Leer cada archivo dentro de la carpeta
    for nombre_archivo in os.listdir(CARPETA_PDFS):
        # Asegurarnos de que solo procesamos archivos PDF
        if nombre_archivo.lower().endswith(".pdf"):
            ruta_completa = os.path.join(CARPETA_PDFS, nombre_archivo)
            print(f"Analizando: {nombre_archivo}...")

            # 3. Abrir el PDF usando pdfplumber
            with pdfplumber.open(ruta_completa) as pdf:
                # Asumimos que la tabla está en la primera página (índice 0)
                pagina = pdf.pages[0]
                
                # Extraemos la tabla. pdfplumber es muy bueno detectando las líneas de la cuadrícula.
                tabla = pagina.extract_table()
                
                if not tabla:
                    print(f"No se detectó ninguna tabla en {nombre_archivo}")
                    continue

                fecha_actual = None
                subtotal_publico = 0

                # 4. Recorrer cada fila de la tabla extraída
                for fila in tabla:
                    # Limpiamos la fila: si hay celdas vacías (None), las convertimos a texto vacío
                    fila_limpia = [str(celda).strip().lower() if celda is not None else "" for celda in fila]
                    
                    # Buscamos si en la primera columna hay una fecha (ej. 17/09/2026)
                    # Comprobamos si tiene un formato típico de fecha buscando la barra '/'
                    if "/" in fila_limpia[0] and len(fila_limpia[0]) >= 8:
                        # Si ya teníamos una fecha anterior procesándose, guardamos su total antes de cambiar
                        if fecha_actual is not None:
                            resultados.append({
                                "Archivo": nombre_archivo,
                                "Fecha": fecha_actual,
                                "Subtotal Público (Sin Cortesía)": subtotal_publico
                            })
                        
                        # Actualizamos a la nueva fecha y reiniciamos el contador a cero
                        fecha_actual = fila_limpia[0]
                        subtotal_publico = 0

                    # 5. Identificar las filas que queremos sumar
                    # Observando la imagen, necesitamos sumar "inteira" y "meia", y saltar "cortesia"
                    # Asumimos que el tipo de ingreso está en la columna 2 y el público en la columna 3 o 4.
                    # Unimos toda la fila en un solo texto para buscar las palabras clave fácilmente.
                    texto_fila = " ".join(fila_limpia)

                    if "inteira" in texto_fila or "meia" in texto_fila:
                        # Evitamos procesar las filas de totales generales del final del documento
                        if "total inteira" in texto_fila or "total meia" in texto_fila:
                            continue
                        
                        try:
                            # Buscamos la columna de "Público". Por la imagen, suele ser la penúltima 
                            # con números antes del valor monetario.
                            # Para ser seguros, recorremos la fila de derecha a izquierda y tomamos 
                            # el segundo valor numérico que encontremos.
                            
                            # Filtramos solo las celdas que contienen números
                            valores_numericos = [celda for celda in fila_limpia if celda.replace('.','',1).isdigit()]
                            
                            if len(valores_numericos) >= 2:
                                # El último número suele ser el 'Valor', el penúltimo es el 'Publico'
                                valor_publico = int(valores_numericos[-2])
                                subtotal_publico += valor_publico
                        except ValueError:
                            # Si ocurre un error al convertir a número, simplemente pasamos a la siguiente fila
                            pass

                # Guardar el último subtotal que quedó pendiente al terminar de leer la tabla
                if fecha_actual is not None:
                    resultados.append({
                        "Archivo": nombre_archivo,
                        "Fecha": fecha_actual,
                        "Subtotal Público (Sin Cortesía)": subtotal_publico
                    })

    # 6. Mostrar y exportar los resultados
    if resultados:
        # Usamos pandas para crear una tabla bonita y exportarla a Excel
        df = pd.DataFrame(resultados)
        print("\n--- RESULTADOS OBTENIDOS ---")
        print(df.to_string(index=False))
        
        # Exportamos los datos a un archivo Excel nuevo en la misma carpeta
        ruta_excel = os.path.join(CARPETA_PDFS, "Reporte_Subtotales.xlsx")
        df.to_excel(ruta_excel, index=False)
        print(f"\nSe ha generado un archivo Excel con los resultados en: {ruta_excel}")
    else:
        print("No se encontraron datos para procesar.")

# Este es el punto de entrada del script
if __name__ == "__main__":
    procesar_archivos()
